sonar.projectKey=clinica365-services
sonar.projectName=clinica365-services
sonar.projectVersion=1.0

sonar.sources=src/main/java
sonar.tests=src/test/java

sonar.java.binaries=target/classes

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# No analizar código generado
sonar.exclusions=**/generated/**,**/model/**,**/*Application*.java

# Analizar estos archivos normalmente,
# pero no exigirles cobertura
sonar.coverage.exclusions=**/dto/**,**/config/**,**/mapper/**,**/domain/**